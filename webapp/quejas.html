<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Quejas y sugerencias — JJM con Causa</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body data-pagina="quejas">
<div id="jjm-header"></div>
<main>

<div class="contenedor" style="max-width:760px">
  <h2>💬 Quejas y sugerencias</h2>
  <div class="tarjeta">
    <form id="form">
      <label>Tipo</label><select id="tipo"><option value="QUEJA">Queja</option><option value="SUGERENCIA">Sugerencia</option></select>
      <label>Asunto</label><input id="asunto" required maxlength="150"/>
      <label>Descripción</label><textarea id="descripcion" required></textarea>
      <div id="msg"></div>
      <button class="btn btn-primario btn-bloque" type="submit">Enviar</button>
    </form>
  </div>
  <div class="titulo-seccion">Mis solicitudes</div>
  <div id="lista"></div>
</div>

</main>
<div id="jjm-footer"></div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/carrito.js"></script>
<script src="js/chatbot.js"></script>
<script>

async function cargar() {
  try {
    const l = await ApiClient.get("/quejas/mias");
    document.getElementById("lista").innerHTML = l.length ? l.map((q) => `<div class="tarjeta" style="margin-bottom:10px">
      <strong>${JJM.esc(q.asunto)}</strong> <span class="estado ${q.estatus}">${q.estatus}</span> <small>${q.tipo} · ${JJM.fecha(q.fechaCreacion)}</small>
      <p>${JJM.esc(q.descripcion)}</p>${q.respuesta ? `<div class="msg-ok"><strong>Respuesta:</strong> ${JJM.esc(q.respuesta)}</div>` : ""}</div>`).join("")
      : '<div class="tarjeta">Aún no has enviado solicitudes.</div>';
  } catch (e) {}
}
if (JJM.requiereRol()) {
  cargar();
  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault(); const msg = document.getElementById("msg");
    try {
      await ApiClient.post("/quejas", { tipo: document.getElementById("tipo").value, asunto: document.getElementById("asunto").value.trim(), descripcion: document.getElementById("descripcion").value.trim() });
      JJM.msg(msg, "ok", "Recibimos tu solicitud. ¡Gracias!"); e.target.reset(); cargar();
    } catch (err) { JJM.msg(msg, "error", err.message); }
  };
}

</script>
</body>
</html>
