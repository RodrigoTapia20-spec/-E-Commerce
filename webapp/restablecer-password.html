<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nueva contraseña — JJM con Causa</title>
<link rel="stylesheet" href="css/styles.css"/>
</head>
<body data-pagina="login">
<div id="jjm-header"></div>
<main>

<div class="panel">
  <h2>Crea tu nueva contraseña</h2>
  <form id="form">
    <label>Nueva contraseña (mínimo 8 caracteres)</label>
    <div class="campo-password">
      <input type="password" id="p1" minlength="8" required autocomplete="new-password"/>
      <button type="button" class="btn-ojo" onclick="JJM.alternarPassword('p1', this)" aria-label="Mostrar contraseña">👁</button>
    </div>
    <label>Confirma la contraseña</label>
    <div class="campo-password">
      <input type="password" id="p2" minlength="8" required autocomplete="new-password"/>
      <button type="button" class="btn-ojo" onclick="JJM.alternarPassword('p2', this)" aria-label="Mostrar contraseña">👁</button>
    </div>
    <div id="msg"></div>
    <button class="btn btn-primario btn-bloque" id="btn" type="submit">Guardar contraseña</button>
  </form>
</div>

</main>
<div id="jjm-footer"></div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/carrito.js"></script>
<script src="js/chatbot.js"></script>
<script>

const token = new URLSearchParams(location.search).get("token");
if (!token) { document.getElementById("form").classList.add("oculto"); JJM.msg(document.getElementById("msg"), "error", "El enlace no es válido. Solicita uno nuevo desde \"¿Olvidaste tu contraseña?\"."); }
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg"); const btn = document.getElementById("btn");
  if (document.getElementById("p1").value !== document.getElementById("p2").value) { JJM.msg(msg, "error", "Las contraseñas no coinciden."); return; }
  btn.disabled = true;
  try {
    const r = await ApiClient.post("/auth/restablecer-password", { token, nuevaPassword: document.getElementById("p1").value });
    JJM.msg(msg, "ok", r.mensaje + " Redirigiendo...");
    setTimeout(() => (location.href = "login.html"), 1600);
  } catch (err) { JJM.msg(msg, "error", err.message); btn.disabled = false; }
};

</script>
</body>
</html>
