# ============================================================
# JJM E-Commerce Backend - Configuración
# ============================================================
spring.application.name=jjm-ecommerce-backend
server.port=8080
server.servlet.context-path=/api

# ---- Base de datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/jjm_ecommerce?useSSL=false&serverTimezone=America/Mexico_City&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Seguridad JWT ----
# IMPORTANTE: reemplazar por una clave secreta robusta gestionada como variable
# de entorno o en un vault antes de pasar a producción.
security.jwt.secret=${JWT_SECRET:CAMBIAR_ESTA_CLAVE_SECRETA_POR_UNA_SEGURA_DE_MIN_256_BITS}
security.jwt.expiration-ms=3600000
security.jwt.refresh-expiration-ms=604800000

# ---- Autenticación en dos pasos (2FA) ----
# Si aún no tienes el correo real configurado (ver bloque de abajo) y quieres
# poder iniciar sesión mientras tanto, cambia esta línea a "false": el login
# entregará el token de una sola vez, sin pedir código. Vuelve a ponerlo en
# "true" cuando ya tengas el correo funcionando, para no perder esta capa de
# seguridad en la versión final.
security.twofactor.enabled=${TWOFACTOR_ENABLED:false}
security.twofactor.code-length=6
security.twofactor.expiration-minutes=5

# ---- Correo (envío de 2FA, notificaciones de pedidos, quejas, etc.) ----
# Para que el correo SÍ llegue (ej. usando Gmail):
#   1. Activa la verificación en 2 pasos en la cuenta de Gmail que vayas a usar.
#   2. Genera una "Contraseña de aplicación" en https://myaccount.google.com/apppasswords
#      (una contraseña normal de Gmail YA NO sirve para esto).
#   3. Reemplaza MAIL_USER por ese correo completo y MAIL_PASSWORD por la
#      contraseña de aplicación de 16 caracteres (sin espacios).
# Mientras estos valores sigan siendo los de ejemplo, el sistema seguirá
# funcionando: el código 2FA se imprime en la consola del backend en vez de
# llegar al correo (busca una línea "[MODO DEV] Código 2FA para ...").
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:notificaciones@jjmtecnologias.com}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

# ---- Integraciones externas (se configuran cuando la empresa tenga las
#      credenciales reales; mientras tanto el backend corre en modo MOCK) ----
integraciones.pasarela-pagos.proveedor=${PAYMENT_PROVIDER:MOCK}
integraciones.pasarela-pagos.api-key=${PAYMENT_API_KEY:}
integraciones.ia-verificacion.proveedor=${AI_VERIFICATION_PROVIDER:MOCK}
integraciones.ia-verificacion.api-key=${AI_VERIFICATION_API_KEY:}
integraciones.chatbot.proveedor=${CHATBOT_PROVIDER:MOCK}
integraciones.chatbot.api-key=${CHATBOT_API_KEY:}

# ---- WhatsApp (recuperación de contraseña) — usa la API de Twilio ----
# Ver instrucciones completas en WhatsAppService.java. Mientras dejes estos
# valores de ejemplo ("changeme"), el mensaje se imprime en la consola del
# backend en vez de llegar por WhatsApp de verdad ("modo desarrollo").
integraciones.whatsapp.account-sid=${WHATSAPP_ACCOUNT_SID:changeme}
integraciones.whatsapp.auth-token=${WHATSAPP_AUTH_TOKEN:changeme}
integraciones.whatsapp.numero-remitente=${WHATSAPP_FROM:whatsapp:+14155238886}
integraciones.whatsapp.lada-defecto=${WHATSAPP_LADA_DEFECTO:+52}

# ---- Carga de archivos (imágenes de productos) ----
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=35MB
app.uploads.directorio=${UPLOADS_DIR:./uploads}

# ---- CORS: permite que la webapp y la app móvil consuman la API ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost}

logging.level.com.jjm.ecommerce=INFO

# ---- Administrador inicial (dueño) — se crea solo si aún no existe ninguno ----
app.admin.correo=${ADMIN_EMAIL:admin@jjm.com}
app.admin.password=${ADMIN_PASSWORD:Admin12345!}

# ---- URL de la web (para el enlace del correo de recuperación de contraseña) ----
app.webapp.url=${WEBAPP_URL:http://localhost:5500}
